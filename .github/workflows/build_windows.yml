name: Build-Windows

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  Build-Windows:
    name: Build-Windows
    strategy:
      fail-fast: false
      matrix:
        go: [1.22.x]
        os: [windows-latest]
    runs-on: ${{ matrix.os}}
    steps:
      - name: install golang
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: checkout
        uses: actions/checkout@v4
      - name: go env
        run: |
          printf "$(go version)\n"
          printf "\n\ngo environment:\n\n"
          go env
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: verify
        shell: bash
        run: ./verify.sh
      - name: update code coverage report
        uses: codecov/codecov-action@v1.2.1
        with:
          files: "artifacts/coverage.out"
          flags: unittests
          verbose: true
          name: codecov-nbio